---
# Compose configuration for the VS Code Dev Container; enables Xdebug.
services:
  php:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    restart: no
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-develop,debug}"
      XDEBUG_CONFIG: "client_host=127.0.0.1 start_with_request=yes"
    volumes:
      - .:/app
